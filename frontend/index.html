<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>Chibani Lotfi AI — Chibani Lotfi AI</title>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">AI VIDEO STUDIO</div>
        <h1>Chibani Lotfi AI</h1>
      </div>
      <span id="apiState" class="pill">OFFLINE</span>
    </header>

    <section class="hero card">
      <h2>حوّل فكرة إلى فيديو 🎬</h2>
      <p>اكتب الموضوع، اختر الإعدادات، واترك الـWorker يقوم بالمعالجة.</p>
    </section>

    <form id="createForm" class="card">
      <label>موضوع الفيديو
        <textarea id="subject" required placeholder="مثال: 5 عادات تغير حياتك"></textarea>
      </label>

      <div class="grid2">
        <label>اللغة
          <select id="language">
            <option value="ar">العربية</option>
            <option value="fr">Français</option>
            <option value="en">English</option>
          </select>
        </label>
        <label>المقاس
          <select id="aspect_ratio">
            <option value="9:16">9:16 — Reels/Shorts</option>
            <option value="1:1">1:1 — Square</option>
            <option value="16:9">16:9 — YouTube</option>
          </select>
        </label>
      </div>

      <div class="grid2">
        <label>المدة
          <select id="duration">
            <option value="30">30 ثانية</option>
            <option value="45">45 ثانية</option>
            <option value="60">60 ثانية</option>
            <option value="90">90 ثانية</option>
            <option value="120">120 ثانية</option>
          </select>
        </label>
        <label>المصادر
          <select id="video_source">
            <option value="pexels">Pexels</option>
            <option value="pixabay">Pixabay</option>
            <option value="coverr">Coverr</option>
            <option value="local">Local</option>
          </select>
        </label>
      </div>

      <div class="grid2">
        <label>الصوت
          <select id="voice">
            <option value="edge">Edge TTS — مجاني</option>
            <option value="none">بدون صوت</option>
          </select>
        </label>
        <label>الترجمة
          <select id="subtitle_provider">
            <option value="edge">Edge timing — سريع</option>
            <option value="whisper">Whisper — أدق</option>
            <option value="none">بدون</option>
          </select>
        </label>
      </div>

      <label class="check"><input id="subtitles" type="checkbox" checked> تفعيل الترجمة</label>
      <label class="check"><input id="music" type="checkbox" checked> إضافة موسيقى</label>

      <button class="primary" type="submit">إنشاء الفيديو</button>
      <p id="message" class="message"></p>
    </form>

    <section class="card">
      <div class="sectionTitle"><h2>المهام</h2><button id="refresh" class="ghost">تحديث</button></div>
      <div id="jobs" class="jobs"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
